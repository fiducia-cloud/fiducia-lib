schema = 2

[tasks.lint]
run = ["cd rust && cargo clippy --all-targets -- -D warnings"]

[tasks.format]
run = ["cd rust && cargo fmt --all -- --check"]

[tasks.check]
description = "Repository gate invoked by CI as `zed task run check`"
aliases = ["ci"]
depends = ["lint", "format"]
run = ["echo 'check: all gates passed'"]
